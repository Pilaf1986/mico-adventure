name: Converti musica lounge in MP3

on:
  push:
    paths:
      - "regia-gold-lounge-v2.opus"
      - ".github/workflows/convert-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Converti Opus in MP3
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -i regia-gold-lounge-v2.opus -codec:a libmp3lame -b:a 192k -ar 44100 -ac 2 regia-gold-lounge-v2.mp3

      - name: Commit MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regia-gold-lounge-v2.mp3
          git diff --cached --quiet || git commit -m "Aggiungi versione MP3 della musica lounge"
          git push
