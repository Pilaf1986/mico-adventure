name: Controllo audio

on:
  push:
    paths:
      - "regia-gold-lounge-v2.mp3"
      - ".github/workflows/check-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analizza MP3
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -i regia-gold-lounge-v2.mp3 -af volumedetect -f null - 2>&1 | tee audio-analysis.txt
          echo "---- FFPROBE ----"
          ffprobe -v error -show_entries format=duration:stream=sample_rate,channels,codec_name,bit_rate -of default=noprint_wrappers=1 regia-gold-lounge-v2.mp3
