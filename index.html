<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiCo Adventure — Regia Gold</title>
<style>
html,body{margin:0;background:#07090e;color:#fff;font-family:monospace;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(1100px,100vw);padding:8px;box-sizing:border-box}
#scene{position:relative;aspect-ratio:16/9;border:3px solid #69717e;background:#111;overflow:hidden;box-shadow:0 0 30px #000}
#bg{width:100%;height:100%;display:block;object-fit:cover}
.hot{position:absolute;cursor:pointer;background:transparent;border:0;z-index:2}
.hot:hover{outline:2px dashed #ffd84a;outline-offset:-2px}
#faderHint{position:absolute;left:24%;top:51%;width:4%;height:7%;border:2px dashed transparent;box-sizing:border-box;pointer-events:none;z-index:9;transition:.15s}
#scene:hover #faderHint{border-color:rgba(255,216,74,.35)}
#ui{background:#11151d;border:3px solid #69717e;border-top:0;padding:7px}
#msg{min-height:34px;font-size:14px;line-height:1.25;margin-bottom:5px}
button{font:bold 12px monospace;background:#252a34;color:#fff;border:2px solid #657080;padding:7px 9px;margin:2px;cursor:pointer}
button:hover,button.sel{background:#3e4654;border-color:#ffd84a;color:#ffd84a}
#inv{font-size:12px;color:#aeb7c4;padding-top:4px}
#panicOverlay{position:absolute;inset:0;background:rgba(170,0,0,.42);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;pointer-events:none}
.panicText{font-size:clamp(28px,6vw,68px);font-weight:bold;color:#ff4545;text-shadow:4px 4px #000;animation:shake .08s infinite alternate}
.panicSub{font-size:clamp(16px,2.5vw,30px);font-weight:bold;color:#fff;text-shadow:3px 3px #000;margin-top:12px}
@keyframes shake{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@media(max-width:600px){#wrap{padding:2px}#msg{font-size:12px}button{font-size:10px;padding:6px 7px}}

#menuBar{display:flex;justify-content:flex-end;margin-bottom:5px}
#menuBtn{font-size:11px;padding:5px 12px}
#menuOverlay,#exitScreen{position:absolute;inset:0;background:rgba(5,7,12,.94);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}
.menuBox{border:3px solid #69717e;background:#11151d;padding:22px;min-width:220px;text-align:center;box-shadow:0 0 35px #000}
.menuTitle{font-size:24px;font-weight:bold;color:#ffd84a;margin-bottom:18px}
.menuBox button{display:block;width:100%;margin:7px 0}
#saveStatus{font-size:11px;color:#aeb7c4;margin-top:10px;min-height:14px}
#saveSlots{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#saveSlots .slotBtn{margin:0;font-size:11px;padding:6px 4px}
#saveSlots .slotBtn.sel{border-color:#ffd84a;color:#ffd84a}
</style>
</head>
<body>
<div id="wrap">
  <div id="scene">
    <img id="bg" src="https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/Regia%20Gold_%20caos%20in%20console.png" alt="Regia Gold MiCo">

    <div class="hot" data-name="mixer" title="MIXER YAMAHA RIVAGE" style="left:21%;top:33%;width:59%;height:35%"></div>
    <div class="hot" data-name="fader" title="FADER" style="left:24%;top:51%;width:4%;height:7%;z-index:10"></div>
    <div class="hot" data-name="postit" title="POST-IT" style="left:42%;top:68%;width:7%;height:12%;z-index:10"></div>
    <div id="faderHint"></div>
    <div class="hot" data-name="radio" title="RADIO" style="left:84%;top:54%;width:7%;height:19%"></div>
    <div class="hot" data-name="phone" title="TELEFONO REGIA" style="left:76%;top:57%;width:8%;height:17%;z-index:10"></div>
    <div class="hot" data-name="monitor" title="MONITOR" style="left:36%;top:22%;width:17%;height:13%"></div>
    <div class="hot" data-name="door" title="PORTA BACKSTAGE" style="left:21%;top:0%;width:13%;height:34%"></div>
    <div class="hot" data-name="cable" title="CAVO DMX" style="left:50%;top:70%;width:18%;height:14%;z-index:10"></div>
    <div class="hot" data-name="coffee" title="CAFFÈ" style="left:82%;top:63%;width:6%;height:11%"></div>

    <div id="panicOverlay">
      <div class="panicText">FIIIIIIIIIIII!</div>
      <div class="panicSub">PANICO IN REGIA!</div>
    </div>

    <div id="menuOverlay">
      <div class="menuBox">
        <div class="menuTitle">MI CO ADVENTURE</div>
        <div style="font-size:11px;color:#aeb7c4;margin-bottom:8px">SCEGLI UNO SLOT</div>
        <div id="saveSlots">
          <button type="button" class="slotBtn" data-slot="1">SLOT 1</button>
          <button type="button" class="slotBtn" data-slot="2">SLOT 2</button>
          <button type="button" class="slotBtn" data-slot="3">SLOT 3</button>
          <button type="button" class="slotBtn" data-slot="4">SLOT 4</button>
          <button type="button" class="slotBtn" data-slot="5">SLOT 5</button>
          <button type="button" class="slotBtn" data-slot="6">SLOT 6</button>
          <button type="button" class="slotBtn" data-slot="7">SLOT 7</button>
          <button type="button" class="slotBtn" data-slot="8">SLOT 8</button>
          <button type="button" class="slotBtn" data-slot="9">SLOT 9</button>
          <button type="button" class="slotBtn" data-slot="10">SLOT 10</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <button type="button" id="saveBtn" style="flex:1">SALVA</button>
          <button type="button" id="loadBtn" style="flex:1">CARICA</button>
        </div>
        <button type="button" id="exitBtn">ESCI</button>
        <div id="saveStatus">Seleziona uno slot.</div>
      </div>
    </div>

    <div id="exitScreen">
      <div class="menuBox">
        <div class="menuTitle">MI CO ADVENTURE</div>
        <div style="margin-bottom:18px">SEI USCITO DALLA REGIA GOLD.</div>
        <button type="button" id="resumeBtn">RIPRENDI PARTITA</button>
      </div>
    </div>
  </div>

  <div id="ui">
    <div id="menuBar"><button type="button" id="menuBtn">☰ MENU</button></div>
    <div id="msg">Benvenuto alla REGIA GOLD. Il congresso sta per iniziare...</div>
    <div id="verbs">
      <button type="button" data-verb="GUARDA">GUARDA</button>
      <button type="button" data-verb="PRENDI">PRENDI</button>
      <button type="button" data-verb="USA">USA</button>
      <button type="button" data-verb="PARLA">PARLA</button>
      <button type="button" data-verb="APRI">APRI</button>
      <button type="button" data-verb="CHIUDI">CHIUDI</button>
      <button type="button" data-verb="DAI">DAI</button>
      <button type="button" data-verb="SPINGI">SPINGI</button>
    </div>
    <div id="inv">Inventario: • nessun oggetto</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const msg = document.getElementById('msg');
  const panic = document.getElementById('panicOverlay');
  const invEl = document.getElementById('inv');
  const buttons = Array.from(document.querySelectorAll('#verbs button'));
  const hotspots = Array.from(document.querySelectorAll('.hot'));
  const menuOverlay = document.getElementById('menuOverlay');
  const exitScreen = document.getElementById('exitScreen');
  const saveStatus = document.getElementById('saveStatus');
  const menuBtn = document.getElementById('menuBtn');
  const saveBtn = document.getElementById('saveBtn');
  const loadBtn = document.getElementById('loadBtn');
  const exitBtn = document.getElementById('exitBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const slotButtons = Array.from(document.querySelectorAll('.slotBtn'));

  let verb = 'GUARDA';
  let radioCalled = false;
  let panicked = false;
  let responsibleCalled = false;
  let cableDiagnosed = false;
  let cableFixed = false;
  let phoneConversationStarted = false;
  let inventory = [];
  let selectedSlot = 1;
  let timers = [];

  function later(fn, ms){
    const id = setTimeout(function(){
      timers = timers.filter(function(t){ return t !== id; });
      fn();
    }, ms);
    timers.push(id);
    return id;
  }

  function clearTimers(){
    timers.forEach(function(id){ clearTimeout(id); });
    timers = [];
  }

  function say(text){
    msg.textContent = text;
  }

  function setVerb(nextVerb){
    verb = nextVerb;
    buttons.forEach(function(button){
      button.classList.toggle('sel', button.dataset.verb === verb);
    });
    say(verb + ' selezionato. Ora clicca un oggetto nella Regia Gold.');
  }

  function beep(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      const audio = new AudioCtx();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(480, audio.currentTime);
      osc.frequency.linearRampToValueAtTime(1450, audio.currentTime + 0.8);
      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 1.1);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 1.15);
    }catch(e){}
  }

  function radioCall(){
    if(radioCalled) return;
    radioCalled = true;
    say('📻 RADIO — TECNICO DI PALCO: «Regia, regia... qui palco! Abbiamo un problema con il microfono del relatore! Non si sente in sala!»');
    const radio = document.querySelector('[data-name="radio"]');
    if(radio){
      radio.style.outline = '3px solid #ff3b30';
      later(function(){ radio.style.outline = ''; }, 1500);
    }
  }

  function useMixer(){
    if(!radioCalled){
      say('Il RIVAGE è pronto. Non tocco niente finché dal palco non arriva una chiamata.');
      return;
    }
    say('Trovo il canale del relatore sul RIVAGE. Eccolo... adesso devo agire sul fader giusto.');
  }

  function useFader(){
    if(!radioCalled){
      say('Non tocco il fader a caso. Prima devo sapere cosa succede sul palco.');
      return;
    }
    if(!panicked){
      panicked = true;
      panic.style.display = 'flex';
      say('FADER SBAGLIATO! FIIIIIIIIIIII! PANICO IN REGIA!');
      beep();
    }else{
      say('Il fader è ancora lì. Il danno ormai è fatto.');
    }
  }

  function callResponsible(){
    if(!panicked){
      return say('Prima devo avere un problema serio da segnalare.');
    }
    if(phoneConversationStarted){
      return say('Il responsabile ha già riattaccato. Ora bisogna risolvere il problema.');
    }

    phoneConversationStarted=true;
    panic.style.display='none';

    say('📞 FONICO: «Ehi, il mixer della plenaria non risponde, fischia tutto!»');

    // Ogni battuta resta abbastanza a lungo per essere letta.
    later(function(){
      say('📞 RESPONSABILE: «Ma che cazzo dici, impara a lavorare!»');
    }, 5000);

    later(function(){
      say('Il responsabile riattacca. In regia rimaniamo solo io e il tecnico di palco.');
    }, 10000);

    later(function(){
      say('🎙️ TECNICO DI PALCO: «Aspetta... ho capito qual è il problema.»');
    }, 15000);

    later(function(){
      cableDiagnosed=true;
      say('🎙️ TECNICO DI PALCO: «Il cavo del microfono è finito nel DMX delle luci! Lo ricollego subito.»');
    }, 20000);
  }

  function fixCable(){
    if(!cableDiagnosed){
      return say('Sono solo cavi sotto la console. Non so ancora quale sia il problema.');
    }
    if(!cableFixed){
      cableFixed=true;
      say('🔌 TECNICO DI PALCO: «Eccolo! Era collegato al DMX delle luci.» Ricollega il cavo del microfono.');

      later(function(){
        say('🎙️ TECNICO DI PALCO: «Prova adesso.»');
      }, 5000);

      later(function(){
        say('🎤 MICROFONO RELATORE: «Uno, due... mi sentite?» — Perfetto. Il congresso può partire.');
      }, 10000);
    }else{
      say('Il cavo è già ricollegato. Il microfono funziona.');
    }
  }

  function getSaveData(){
    return {
      version: 1,
      verb: verb,
      radioCalled: radioCalled,
      panicked: panicked,
      responsibleCalled: responsibleCalled,
      cableDiagnosed: cableDiagnosed,
      cableFixed: cableFixed,
      phoneConversationStarted: phoneConversationStarted,
      inventory: inventory.slice(),
      message: msg.textContent,
      panicVisible: panic.style.display
    };
  }

  function updateSlotButtons(){
    slotButtons.forEach(function(button){
      button.classList.toggle('sel', Number(button.dataset.slot) === selectedSlot);
      const exists=!!localStorage.getItem('micoAdventureSave'+button.dataset.slot);
      button.textContent='SLOT '+button.dataset.slot+(exists ? ' • SALVATO' : '');
    });
  }

  function saveGame(){
    try{
      localStorage.setItem('micoAdventureSave'+selectedSlot, JSON.stringify(getSaveData()));
      saveStatus.textContent='PARTITA SALVATA NELLO SLOT '+selectedSlot+'.';
      say('Partita salvata nello slot '+selectedSlot+'.');
      updateSlotButtons();
    }catch(e){
      saveStatus.textContent='ERRORE DI SALVATAGGIO.';
      say('Non riesco a salvare la partita.');
    }
  }

  function loadGame(){
    try{
      const raw=localStorage.getItem('micoAdventureSave'+selectedSlot);
      if(!raw){
        saveStatus.textContent='LO SLOT '+selectedSlot+' È VUOTO.';
        say('Lo slot '+selectedSlot+' è vuoto.');
        return;
      }
      clearTimers();
      const data=JSON.parse(raw);
      verb=data.verb || 'GUARDA';
      radioCalled=!!data.radioCalled;
      panicked=!!data.panicked;
      responsibleCalled=!!data.responsibleCalled;
      cableDiagnosed=!!data.cableDiagnosed;
      cableFixed=!!data.cableFixed;
      phoneConversationStarted=!!data.phoneConversationStarted;
      inventory=Array.isArray(data.inventory) ? data.inventory.slice() : [];
      msg.textContent=data.message || 'Partita caricata.';
      panic.style.display=data.panicVisible || 'none';
      invEl.textContent=inventory.length ? 'Inventario: • '+inventory.join(' • ') : 'Inventario: • nessun oggetto';
      buttons.forEach(function(button){
        button.classList.toggle('sel', button.dataset.verb === verb);
      });
      saveStatus.textContent='SLOT '+selectedSlot+' CARICATO.';
    }catch(e){
      saveStatus.textContent='SALVATAGGIO DANNEGGIATO.';
      say('Non riesco a caricare la partita.');
    }
  }

  function openMenu(){
    menuOverlay.style.display='flex';
    saveStatus.textContent='';
  }

  function closeMenu(){
    menuOverlay.style.display='none';
  }

  menuBtn.addEventListener('click', openMenu);
  slotButtons.forEach(function(button){
    button.addEventListener('click', function(){
      selectedSlot=Number(button.dataset.slot);
      updateSlotButtons();
      saveStatus.textContent='SLOT '+selectedSlot+' SELEZIONATO.';
    });
  });
  saveBtn.addEventListener('click', saveGame);
  loadBtn.addEventListener('click', loadGame);
  exitBtn.addEventListener('click', function(){
    menuOverlay.style.display='none';
    exitScreen.style.display='flex';
  });
  resumeBtn.addEventListener('click', function(){
    exitScreen.style.display='none';
  });

  function act(name){
    if(verb === 'GUARDA'){
      if(name === 'mixer') return say('Yamaha RIVAGE. La regia è pronta per la plenaria.');
      if(name === 'fader') return say('Il primo fader a sinistra del RIVAGE. È quello che devo manovrare.');
      if(name === 'postit') return say('Il post-it dice: NO FEEDBACK! Un consiglio che arriva sempre troppo tardi.');
      if(name === 'radio') return say('La radio di servizio. Da qui arrivano le chiamate dal palco.');
      if(name === 'phone') return say('Il telefono della regia. Quando qualcosa va storto, qualcuno finisce sempre per chiamare il responsabile.');
      if(name === 'monitor') return say('RELATORE PRONTO • PLENARIA • STREAMING OK. Per ora...');
      if(name === 'door') return say('Backstage. Cavi, relatori, runner e almeno tre persone che cercano qualcuno.');
      if(name === 'cable') return say('Un groviglio di cavi sotto la console. Uno di questi va verso il sistema luci.');
      if(name === 'coffee') return say('Caffè. L’unica cosa veramente indispensabile in regia.');
    }

    if(verb === 'PRENDI'){
      if(name === 'coffee'){
        if(inventory.indexOf('CAFFÈ') === -1){
          inventory.push('CAFFÈ');
          invEl.textContent = 'Inventario: • CAFFÈ';
          say('Prendi il caffè. La vera alimentazione del fonico.');
        }else{
          say('Il caffè è già nel tuo inventario.');
        }
      }else{
        say('Non posso prendere quello.');
      }
      return;
    }

    if(verb === 'USA'){
      if(name === 'radio') return panicked ? callResponsible() : radioCall();
      if(name === 'mixer') return useMixer();
      if(name === 'fader') return useFader();
      if(name === 'phone') return callResponsible();
      if(name === 'cable') return fixCable();
      if(name === 'coffee') return say('Il caffè si usa in modo molto semplice: bevendolo.');
      return say('Non posso usarlo così.');
    }

    if(verb === 'PARLA'){
      if(name === 'radio') return panicked ? callResponsible() : radioCall();
      if(name === 'phone') return callResponsible();
      if(name === 'cable') return cableDiagnosed ? say('«È quello! Il cavo era finito nel DMX delle luci.»') : say('«Che succede con questi cavi?» — Il tecnico di palco sta ancora cercando di capire.');
      if(name === 'door') return say('«Che succede sul palco?» — Nessuna risposta. Il backstage è nel caos.');
      return say('Non c’è nessuno con cui parlare qui.');
    }

    if(verb === 'APRI'){
      if(name === 'door') return say('Apro la porta verso il backstage.');
      return say('Non si apre.');
    }

    if(verb === 'CHIUDI'){
      if(name === 'door') return say('Chiudo la porta della regia. Meglio concentrarsi.');
      return say('Non posso chiuderlo.');
    }

    if(verb === 'SPINGI'){
      if(name === 'fader') return useFader();
      if(name === 'cable') return fixCable();
      return say('Non è qualcosa da spingere.');
    }

    if(verb === 'DAI'){
      if(name === 'radio' && inventory.indexOf('CAFFÈ') !== -1) return say('«Un caffè?» — No. Dalla radio non arriva nessuna risposta.');
      return say('A chi dovrei darlo?');
    }
  }

  buttons.forEach(function(button){
    button.classList.toggle('sel', button.dataset.verb === verb);
    button.addEventListener('click', function(){
      setVerb(button.dataset.verb);
    });
  });

  hotspots.forEach(function(hotspot){
    hotspot.addEventListener('click', function(){
      act(hotspot.dataset.name);
    });
  });

  later(radioCall, 2500);
})();
</script>
</body>
</html>
