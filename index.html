<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiCo Adventure — Regia Gold</title>
<style>
html,body{margin:0;background:#07090e;color:#fff;font-family:monospace;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(1100px,100vw);padding:8px;box-sizing:border-box}
#scene{position:relative;aspect-ratio:16/9;border:3px solid #69717e;background:#111;overflow:hidden;box-shadow:0 0 30px #000}
#bg{width:100%;height:100%;display:block;object-fit:cover}
.hot{position:absolute;cursor:pointer;background:transparent;border:0;z-index:2}
.hot:hover{outline:2px dashed #ffd84a;outline-offset:-2px}
#faderHint{position:absolute;left:24%;top:51%;width:4%;height:7%;border:2px dashed transparent;box-sizing:border-box;pointer-events:none;z-index:9;transition:.15s}
#scene:hover #faderHint{border-color:rgba(255,216,74,.35)}
#ui{background:#11151d;border:3px solid #69717e;border-top:0;padding:7px}
#msg{min-height:34px;font-size:14px;line-height:1.25;margin-bottom:5px}
button{font:bold 12px monospace;background:#252a34;color:#fff;border:2px solid #657080;padding:7px 9px;margin:2px;cursor:pointer}
button:hover,button.sel{background:#3e4654;border-color:#ffd84a;color:#ffd84a}
#inv{font-size:12px;color:#aeb7c4;padding-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.invLabel{color:#aeb7c4}
.invItem{font:bold 11px monospace;background:#252a34;color:#fff;border:2px solid #657080;padding:4px 7px;margin:0;cursor:pointer}
.invItem:hover{background:#3e4654;border-color:#ffd84a;color:#ffd84a}
#goWarehouse,#goBarrier{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:30;display:none;font-size:15px;padding:10px 18px;background:#252a34;color:#fff;border:3px solid #ffd84a;box-shadow:0 0 18px #000;cursor:pointer;font-family:monospace;font-weight:bold}
#goWarehouse:hover,#goBarrier:hover{background:#3e4654;color:#ffd84a}
#panicOverlay{position:absolute;inset:0;background:rgba(170,0,0,.42);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;pointer-events:none}
.panicText{font-size:clamp(28px,6vw,68px);font-weight:bold;color:#ff4545;text-shadow:4px 4px #000;animation:shake .08s infinite alternate}
.panicSub{font-size:clamp(16px,2.5vw,30px);font-weight:bold;color:#fff;text-shadow:3px 3px #000;margin-top:12px}
@keyframes shake{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@media(max-width:600px){#wrap{padding:2px}#msg{font-size:12px}button{font-size:10px;padding:6px 7px}}

#menuBar{display:flex;justify-content:flex-end;margin-bottom:5px}
#menuBtn{font-size:11px;padding:5px 12px}
#menuOverlay,#exitScreen{position:absolute;inset:0;background:rgba(5,7,12,.94);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}
.menuBox{border:3px solid #69717e;background:#11151d;padding:22px;min-width:220px;text-align:center;box-shadow:0 0 35px #000}
.menuTitle{font-size:24px;font-weight:bold;color:#ffd84a;margin-bottom:18px}
.menuBox button{display:block;width:100%;margin:7px 0}
#saveStatus{font-size:11px;color:#aeb7c4;margin-top:10px;min-height:14px}
#saveSlots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
#saveSlots .slotBtn{margin:0;font-size:11px;padding:6px 4px}
#saveSlots .slotBtn.sel{border-color:#ffd84a;color:#ffd84a}
</style>
</head>
<body>
<div id="wrap">
  <div id="scene">
    <img id="bg" src="https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/Regia%20Gold_%20caos%20in%20console.png" alt="Regia Gold MiCo">

    <div class="hot" data-name="mixer" title="MIXER YAMAHA RIVAGE" style="left:21%;top:33%;width:59%;height:35%"></div>
    <div class="hot" data-name="fader" title="FADER" style="left:24%;top:51%;width:4%;height:7%;z-index:10"></div>
    <div class="hot" data-name="postit" title="POST-IT" style="left:42%;top:68%;width:7%;height:12%;z-index:10"></div>
    <div id="faderHint"></div>
    <div class="hot" data-name="radio" title="RADIO" style="left:85%;top:57%;width:3%;height:14%"></div>
    <div class="hot" data-name="phone" title="TELEFONO REGIA" style="left:76%;top:57%;width:8%;height:17%;z-index:10"></div>
    <div class="hot" data-name="monitor" title="MONITOR" style="left:36%;top:22%;width:17%;height:13%"></div>
    <div class="hot" data-name="door" title="PORTA BACKSTAGE" style="left:21%;top:0%;width:13%;height:34%"></div>
    <div class="hot" data-name="cable" title="CAVO DMX" style="left:50%;top:70%;width:18%;height:14%;z-index:10"></div>
    <div class="hot" data-name="coffee" title="CAFFÈ" style="left:82%;top:63%;width:6%;height:11%"></div>

    <button type="button" id="goWarehouse">🚪 VAI IN MAGAZZINO</button>
    <button type="button" id="goBarrier">🚧 VAI ALLA SBARRA</button>

    <div id="panicOverlay">
      <div class="panicText">FIIIIIIIIIIII!</div>
      <div class="panicSub">PANICO IN REGIA!</div>
    </div>

    <div id="menuOverlay">
      <div class="menuBox">
        <div class="menuTitle">MI CO ADVENTURE</div>
        <div style="font-size:11px;color:#aeb7c4;margin-bottom:8px">SCEGLI UNO SLOT</div>
        <div id="saveSlots">
          <button type="button" class="slotBtn" data-slot="1">SLOT 1</button>
          <button type="button" class="slotBtn" data-slot="2">SLOT 2</button>
          <button type="button" class="slotBtn" data-slot="3">SLOT 3</button>
          <button type="button" class="slotBtn" data-slot="4">SLOT 4</button>
          <button type="button" class="slotBtn" data-slot="5">SLOT 5</button>
          <button type="button" class="slotBtn" data-slot="6">SLOT 6</button>
          <button type="button" class="slotBtn" data-slot="7">SLOT 7</button>
          <button type="button" class="slotBtn" data-slot="8">SLOT 8</button>
          <button type="button" class="slotBtn" data-slot="9">SLOT 9</button>
          <button type="button" class="slotBtn" data-slot="10">SLOT 10</button>
          <button type="button" class="slotBtn" data-slot="11">SLOT 11</button>
          <button type="button" class="slotBtn" data-slot="12">SLOT 12</button>
          <button type="button" class="slotBtn" data-slot="13">SLOT 13</button>
          <button type="button" class="slotBtn" data-slot="14">SLOT 14</button>
          <button type="button" class="slotBtn" data-slot="15">SLOT 15</button>
          <button type="button" class="slotBtn" data-slot="16">SLOT 16</button>
          <button type="button" class="slotBtn" data-slot="17">SLOT 17</button>
          <button type="button" class="slotBtn" data-slot="18">SLOT 18</button>
          <button type="button" class="slotBtn" data-slot="19">SLOT 19</button>
          <button type="button" class="slotBtn" data-slot="20">SLOT 20</button>
        </div>
        <input type="text" id="saveName" maxlength="40" placeholder="Nome del salvataggio..." style="width:100%;box-sizing:border-box;background:#0b0e14;color:#fff;border:2px solid #657080;padding:7px;font:12px monospace;margin-top:10px">
        <div style="display:flex;gap:6px;margin-top:6px">
          <button type="button" id="saveBtn" style="flex:1">SALVA</button>
          <button type="button" id="loadBtn" style="flex:1">CARICA</button>
          <button type="button" id="deleteBtn" style="flex:1">CANCELLA</button><button type="button" id="renameBtn" style="flex:1">RINOMINA</button><button type="button" id="audioBtn" style="flex:1">🔊 AUDIO ON</button>
        </div>
        <button type="button" id="exitBtn">TORNA AL GIOCO</button>
        <div id="saveStatus">Seleziona uno slot.</div>
      </div>
    </div>

    <div id="exitScreen">
      <div class="menuBox">
        <div class="menuTitle">MI CO ADVENTURE</div>
        <div style="margin-bottom:18px">SEI USCITO DALLA REGIA GOLD.</div>
        <button type="button" id="resumeBtn">RIPRENDI PARTITA</button>
      </div>
    </div>
  </div>

  <div id="ui">
    <div id="menuBar"><button type="button" id="menuBtn">☰ MENU</button></div>
    <div id="msg">Benvenuto alla REGIA GOLD. Il congresso sta per iniziare...</div>
    <div id="verbs">
      <button type="button" data-verb="GUARDA">GUARDA</button>
      <button type="button" data-verb="PRENDI">PRENDI</button>
      <button type="button" data-verb="USA">USA</button>
      <button type="button" data-verb="PARLA">PARLA</button>
      <button type="button" data-verb="APRI">APRI</button>
      <button type="button" data-verb="CHIUDI">CHIUDI</button>
      <button type="button" data-verb="DAI">DAI</button>
      <button type="button" data-verb="SPINGI">SPINGI</button>
    </div>
    <div id="inv"><span class="invLabel">Inventario:</span><span class="invLabel">• nessun oggetto</span></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const msg = document.getElementById('msg');
  const panic = document.getElementById('panicOverlay');
  const goWarehouse = document.getElementById('goWarehouse');
  const goBarrier = document.getElementById('goBarrier');
  const invEl = document.getElementById('inv');
  const buttons = Array.from(document.querySelectorAll('#verbs button'));
  const hotspots = Array.from(document.querySelectorAll('.hot'));
  const menuOverlay = document.getElementById('menuOverlay');
  const exitScreen = document.getElementById('exitScreen');
  const menuBtn = document.getElementById('menuBtn');
  const exitBtn = document.getElementById('exitBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const saveStatus = document.getElementById('saveStatus');
  const saveBtn = document.getElementById('saveBtn');
  const loadBtn = document.getElementById('loadBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const renameBtn = document.getElementById('renameBtn');
  const audioBtn = document.getElementById('audioBtn');
  const saveName = document.getElementById('saveName');
  const slotButtons = Array.from(document.querySelectorAll('.slotBtn'));

  let verb = 'GUARDA';
  let radioCalled = false;
  let panicked = false;
  let responsibleCalled = false;
  let cableDiagnosed = false;
  let cableFixed = false;
  let phoneConversationStarted = false;
  let inventory = [];
  let selectedSlot = 1;
  let timers = [];
  let coffeeDrunk = false;
  let scene = 'regia';
  let warehouseConversationStarted = false;
  let barrierReached = false;
  let passChecked = false;
  let cooperativeCleared = false;
  let accessGranted = false;
  let selectedItem = '';
  let audioMuted = false;

  function later(fn, ms){
    const id = setTimeout(function(){
      timers = timers.filter(function(t){ return t !== id; });
      fn();
    }, ms);
    timers.push(id);
    return id;
  }

  function clearTimers(){
    timers.forEach(function(id){ clearTimeout(id); });
    timers = [];
  }

  function say(text){
    msg.textContent = text;
  }

  function setVerb(nextVerb){
    verb = nextVerb;
    buttons.forEach(function(button){
      button.classList.toggle('sel', button.dataset.verb === verb);
    });
    say(scene === 'warehouse'
      ? verb + ' selezionato. Ora clicca un oggetto nel Magazzino.'
      : scene === 'barrier'
        ? verb + ' selezionato. Ora clicca un oggetto alla Sbarra.'
        : verb + ' selezionato. Ora clicca un oggetto nella Regia Gold.');
  }

  const itemDescriptions = {
    'CAFFÈ': '☕ CAFFÈ — Un caffè della macchinetta del MiCo. È tiepido, leggermente bruciato e probabilmente è qui da almeno mezz\'ora. Ma per un fonico è carburante puro.',
    'CELLULARE': '📱 CELLULARE — Lo smartphone di Andriu. Batteria sufficiente e linea presente. Può essere usato per chiamare la cooperativa.',
    'PASS': '🪪 PASS MICO — Il badge di Andriu. È il documento che serve per superare i controlli di accesso.'
  };

  function presentPassToGuard(){
    if(accessGranted) return say('👮 GUARDIA: «Tutto a posto. Puoi entrare.»');
    if(!cooperativeCleared){
      if(passChecked) return say('👮 GUARDIA: «Questo l’ho già controllato. Il sistema dice che il PASS è revocato.»');
      passChecked=true;
      say('🪪 Andriu consegna il PASS alla guardia. La guardia lo appoggia sul lettore.');
      later(function(){
        say('📟 LETTORE PASS: «ACCESSO NEGATO — PASS REVOCATO.»');
      },7000);
      later(function(){
        say('👮 GUARDIA: «Eh, carissimo... qui il sistema dice che non puoi entrare.»');
      },14000);
      return;
    }
    accessGranted=true;
    selectedItem='';
    say('🪪 Andriu ridà il PASS alla guardia. La guardia lo passa sul lettore.');
    later(function(){
      say('📟 LETTORE PASS: «AUTORIZZAZIONE CONFERMATA — ACCESSO CONSENTITO.»');
    },7000);
    later(function(){
      say('👮 GUARDIA: «Tutto a posto, carissimo. Puoi entrare.»');
    },14000);
    later(function(){
      say('🚧 La sbarra si alza. Andriu può rientrare al MiCo.');
      goWarehouse.textContent='🚪 VAI AL MAGAZZINO';
      goWarehouse.style.display='block';
    },21000);
  }

  function callCooperative(){
    if(cooperativeCleared) return say('📱 La cooperativa ha già risolto la situazione. Ora devi dare di nuovo il PASS alla guardia.');
    say('📱 CHIAMATA ALLA COOPERATIVA — «Pronto? Sono Andriu. Mi hanno revocato il pass e sono alla sbarra del MiCo.»');
    later(function(){
      say('📞 COOPERATIVA: «Ricevuto Andriu. Aspetta alla sbarra, verifichiamo la situazione e ti richiamiamo.»');
    },7000);
    later(function(){
      cooperativeCleared=true;
      say('📞 COOPERATIVA: «Ho sentito l’ufficio PASS.»');
    },14000);
    later(function(){
      say('📞 COOPERATIVA: «Devi averla combinata grossa, ho dovuto ungere molti ingranaggi.»');
    },21000);
    later(function(){
      say('📞 COOPERATIVA: «Comunque ora puoi entrare.»');
    },28000);
    later(function(){
      say('📱 CHIAMATA TERMINATA — Ora devi ridare il PASS alla guardia.');
    },35000);
  }

  function renderInventory(){
    invEl.innerHTML = '';
    const label = document.createElement('span');
    label.className = 'invLabel';
    label.textContent = 'Inventario:';
    invEl.appendChild(label);

    if(!inventory.length){
      const empty = document.createElement('span');
      empty.className = 'invLabel';
      empty.textContent = '• nessun oggetto';
      invEl.appendChild(empty);
      return;
    }

    inventory.forEach(function(item){
      const itemButton = document.createElement('button');
      itemButton.type = 'button';
      itemButton.className = 'invItem';
      itemButton.textContent = item;
      itemButton.title = 'Esamina ' + item;
      itemButton.addEventListener('click', function(){
        if(verb === 'USA'){
          selectedItem = item;
          if(item === 'CELLULARE' && scene === 'barrier') return callCooperative();
          if(item === 'PASS' && scene === 'barrier'){
            return say('🪪 PASS selezionato. Ora clicca sulla GUARDIA per mostrarlo.');
          }
        }
        say(itemDescriptions[item] || 'Non c’è niente di particolarmente interessante da notare.');
      });
      invEl.appendChild(itemButton);
    });
  }


  const warehouseBackground = 'https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/assets/magazzino-mico-av.png';
  const barrierBackground = 'https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/assets/La%20sbarra%20del%20MiCo%20al%20tramonto.png';
  const regiaBackground = 'https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/Regia%20Gold_%20caos%20in%20console.png';

  function configureWarehouseHotspots(){
    const config = {
      mixer:   {title:'BAULI MICO A/V', style:'left:0%;top:25%;width:28%;height:55%'},
      fader:   {title:'ATTREZZATURA', style:'left:1%;top:55%;width:18%;height:25%'},
      postit:  {title:'MATERIALI', style:'left:25%;top:62%;width:20%;height:20%'},
      radio:   {title:'RADIO', style:'left:70%;top:43%;width:7%;height:18%'},
      phone:   {title:'ON SITE MANAGER', style:'left:52%;top:30%;width:20%;height:42%'},
      monitor: {title:'RIUNIONE TECNICA', style:'left:67%;top:25%;width:30%;height:45%'},
      door:    {title:'USCITA MAGAZZINO', style:'left:42%;top:12%;width:18%;height:30%'},
      cable:   {title:'CAVI A/V', style:'left:72%;top:65%;width:25%;height:20%'},
      coffee:  {title:'BAULE', style:'left:40%;top:65%;width:16%;height:20%'}
    };
    hotspots.forEach(function(h){
      const name=h.dataset.name;
      if(config[name]){
        h.style.cssText=config[name].style;
        h.style.zIndex='10';
        h.title=config[name].title;
      }
    });
  }

  function configureBarrierHotspots(){
    const config = {
      // Sbarra: la barra rossa attraversa orizzontalmente il centro della scena.
      mixer:   {title:'SBARRA AUTOMATICA', style:'left:36%;top:43%;width:48%;height:12%'},
      // Guardiola: cabina sulla sinistra.
      fader:   {title:'GUARDIOLA', style:'left:4%;top:20%;width:29%;height:55%'},
      // Cartello "INGRESSO FORNITORI E TECNICI".
      postit:  {title:'CARTELLO FORNITORI', style:'left:1%;top:30%;width:13%;height:24%'},
      // Telecamera sul palo sopra la sbarra.
      radio:   {title:'TELECAMERA', style:'left:40%;top:5%;width:10%;height:23%'},
      // GUARDIA: hotspot stretto e centrato esattamente sul corpo della guardia.
      phone:   {title:'GUARDIA — CONTROLLO PASS', style:'left:43%;top:27%;width:17%;height:56%'},
      // Edificio/insegna MiCo sullo sfondo.
      monitor: {title:'INGRESSO MICO', style:'left:61%;top:27%;width:25%;height:30%'},
      // Segnaletica sulla destra.
      door:    {title:'SEGNALETICA', style:'left:87%;top:12%;width:12%;height:58%'},
      // Zona stradale davanti alla sbarra.
      cable:   {title:'PIAZZALE', style:'left:26%;top:57%;width:60%;height:22%'},
      // New Jersey in primo piano.
      coffee:  {title:'BLOCCO DI CEMENTO', style:'left:0%;top:62%;width:30%;height:20%'}
    };
    hotspots.forEach(function(h){
      const name=h.dataset.name;
      if(config[name]){
        h.style.cssText=config[name].style;
        h.style.zIndex='10';
        h.title=config[name].title;
      }
    });
  }

  function enterBarrier(){
    clearTimers();
    scene='barrier';
    barrierReached=true;
    if(typeof warehouseAudio !== 'undefined'){
      warehouseAudio.pause();
      warehouseAudio.currentTime=0;
      warehouseStarted=false;
    }
    if(!audioMuted && typeof barrierAudio !== 'undefined'){
      barrierAudio.currentTime=0;
      barrierAudio.play().catch(function(){});
      barrierStarted=true;
    }
    if(typeof loungeAudio !== 'undefined'){
      loungeAudio.pause();
      loungeAudio.currentTime=0;
      loungeStarted=false;
    }
    goWarehouse.style.display='none';
    goBarrier.style.display='none';
    panic.style.display='none';
    const bg=document.getElementById('bg');
    bg.src=barrierBackground;
    bg.onerror=function(){
      bg.src=warehouseBackground;
    };
    configureBarrierHotspots();
    if(inventory.indexOf('CELLULARE') === -1) inventory.push('CELLULARE');
    if(inventory.indexOf('PASS') === -1) inventory.push('PASS');
    renderInventory();
    say('🚧 LA SBARRA — Andriu è uscito dal magazzino. Davanti a lui, la barriera d’ingresso del MiCo.');
  }

  function enterWarehouse(){
    clearTimers();
    scene='warehouse';
    if(typeof loungeAudio !== 'undefined'){
      loungeAudio.pause();
      loungeAudio.currentTime = 0;
      loungeStarted = false;
    }
    if(typeof barrierAudio !== 'undefined'){
      barrierAudio.pause();
      barrierAudio.currentTime=0;
      barrierStarted=false;
    }
    if(typeof warehouseAudio !== 'undefined'){
      warehouseAudio.currentTime = 0;
      warehouseAudio.play().catch(function(){});
      warehouseStarted = true;
    }
    panic.style.display='none';
    goWarehouse.style.display='none';
    const bg=document.getElementById('bg');
    bg.src=warehouseBackground;
    bg.onerror=function(){
      bg.src=regiaBackground;
    };
    configureWarehouseHotspots();
    say('MAGAZZINO MICO A/V — Andriu è arrivato al livello iniziale della sua nuova carriera.');
  }

  function talkOnSiteManager(){
    if(warehouseConversationStarted){
      return say('ON SITE MANAGER: «Il pass è revocato. Devi uscire, sentire la cooperativa e poi rientrare.»');
    }
    warehouseConversationStarted=true;
    say('🎙️ ON SITE MANAGER: «Andriu, hai sbagliato. Il pass di ingresso è stato revocato.»');
    later(function(){
      say('🎙️ ON SITE MANAGER: «Devi uscire, sentire la cooperativa e poi rientrare. Segui le procedure e buon lavoro.»');
    },7000);
    later(function(){
      say('🚧 Fine briefing. Andriu deve andare alla sbarra.');
      goBarrier.style.display='block';
    },14000);
  }

  function drinkCoffee(){
    if(coffeeDrunk) return say('☕ Ho già bevuto il caffè. Ora sono pronto a lavorare.');
    clearTimers();
    coffeeDrunk = true;
    inventory = inventory.filter(function(item){ return item !== 'CAFFÈ'; });
    renderInventory();
    say('☕ Bevo il caffè. Ahhh... adesso sì che si lavora!');
  }

  function beep(){
    try{
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(!AudioCtx) return;
      const audio = new AudioCtx();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(480, audio.currentTime);
      osc.frequency.linearRampToValueAtTime(1450, audio.currentTime + 0.8);
      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 1.1);
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 1.15);
    }catch(e){}
  }

  function radioCall(){
    if(radioCalled) return;
    radioCalled = true;
    say('📻 RADIO — TECNICO DI PALCO: «Regia, regia... qui palco! Abbiamo un problema con il microfono del relatore! Non si sente in sala!»');
    const radio = document.querySelector('[data-name="radio"]');
    if(radio){
      radio.style.outline = '3px solid #ff3b30';
      later(function(){ radio.style.outline = ''; }, 1500);
    }
  }

  function useMixer(){
    if(!radioCalled){
      say('Il RIVAGE è pronto. Non tocco niente finché dal palco non arriva una chiamata.');
      return;
    }
    say('Trovo il canale del relatore sul RIVAGE. Eccolo... adesso devo agire sul fader giusto.');
  }

  function useFader(){
    if(!radioCalled){
      say('Non tocco il fader a caso. Prima devo sapere cosa succede sul palco.');
      return;
    }
    if(!panicked){
      panicked = true;
      panic.style.display = 'flex';
      say('FADER SBAGLIATO! FIIIIIIIIIIII! PANICO IN REGIA!');
      beep();
    }else{
      say('Il fader è ancora lì. Il danno ormai è fatto.');
    }
  }

  function callResponsible(){
    if(!panicked){
      return say('Prima devo avere un problema serio da segnalare.');
    }
    if(phoneConversationStarted){
      return say('Il responsabile ha già riattaccato. Ora bisogna risolvere il problema.');
    }

    phoneConversationStarted=true;
    panic.style.display='none';

    say('📞 FONICO: «Ehi, il mixer della plenaria non risponde, fischia tutto!»');

    // Ogni battuta resta abbastanza a lungo per essere letta.
    later(function(){
      say('📞 RESPONSABILE: «Ma che cazzo dici, impara a lavorare!»');
    }, 7000);

    later(function(){
      say('Il responsabile riattacca. In regia rimaniamo solo io e il tecnico di palco.');
    }, 14000);

    later(function(){
      say('🎙️ TECNICO DI PALCO: «Aspetta... ho capito qual è il problema.»');
    }, 21000);

    later(function(){
      cableDiagnosed=true;
      say('🎙️ TECNICO DI PALCO: «Il cavo del microfono è finito nel DMX delle luci! Lo ricollego subito.»');
    }, 28000);
  }

  function fixCable(){
    if(!cableDiagnosed){
      return say('Sono solo cavi sotto la console. Non so ancora quale sia il problema.');
    }
    if(!cableFixed){
      cableFixed=true;
      say('🔌 TECNICO DI PALCO: «Eccolo! Era collegato al DMX delle luci.» Ricollega il cavo del microfono.');

      later(function(){
        say('🎙️ TECNICO DI PALCO: «Prova adesso.»');
      }, 7000);

      later(function(){
        say('🎤 MICROFONO RELATORE: «Uno, due... mi sentite?» — Perfetto. Il congresso può partire.');
      }, 14000);

      later(function(){
        say('📞 TELEFONO REGIA — RESPONSABILE: «Hai sbagliato, ha fischiato tutto, sei stato degradato, devi ricominciare la tua carriera dal livello iniziale di voi sottoposti, la SALETTA.»');
      }, 21000);

      later(function(){
        say('📞 RESPONSABILE: «Vai in magazzino, segui le istruzioni dell’ON SITE MANAGER e buon divertimento. Che la tua carriera abbia un nuovo inizio.»');
      }, 28000);

      later(function(){
        say('🚪 FINE REGIA GOLD — Vai in magazzino. La tua nuova carriera comincia dalla SALETTA.');
        goWarehouse.style.display='block';
      }, 35000);
    }else{
      say('Il cavo è già ricollegato. Il microfono funziona.');
    }
  }


  function getSaveData(){
    return {
      version: 3,
      saveName: saveName.value.trim(),
      scene: scene,
      warehouseConversationStarted: warehouseConversationStarted,
      barrierReached: barrierReached,
      passChecked: passChecked,
      cooperativeCleared: cooperativeCleared,
      accessGranted: accessGranted,
      selectedItem: selectedItem,
      verb: verb,
      radioCalled: radioCalled,
      panicked: panicked,
      responsibleCalled: responsibleCalled,
      cableDiagnosed: cableDiagnosed,
      cableFixed: cableFixed,
      phoneConversationStarted: phoneConversationStarted,
      inventory: inventory.slice(),
      message: msg.textContent,
      panicVisible: panic.style.display
    };
  }

  function updateSlotButtons(){
    slotButtons.forEach(function(button){
      button.classList.toggle('sel', Number(button.dataset.slot) === selectedSlot);
      const raw=localStorage.getItem('micoAdventureSave'+button.dataset.slot);
      let label='SLOT '+button.dataset.slot;
      if(raw){
        try{
          const data=JSON.parse(raw);
          label += ' • ' + (data.saveName || 'SALVATO');
        }catch(e){
          label += ' • SALVATO';
        }
      }
      button.textContent=label;
    });
  }

  function saveGame(){
    try{
      if(!saveName.value.trim()) saveName.value='Salvataggio '+selectedSlot;
      localStorage.setItem('micoAdventureSave'+selectedSlot, JSON.stringify(getSaveData()));
      saveStatus.textContent='PARTITA SALVATA NELLO SLOT '+selectedSlot+'.';
      say('Partita salvata nello slot '+selectedSlot+'.');
      updateSlotButtons();
    }catch(e){
      saveStatus.textContent='ERRORE DI SALVATAGGIO.';
      say('Non riesco a salvare la partita.');
    }
  }

  function renameGame(){
    const key='micoAdventureSave'+selectedSlot;
    const name=saveName.value.trim();
    if(!name){
      saveStatus.textContent='INSERISCI UN NOME PER LO SLOT '+selectedSlot+'.';
      saveName.focus();
      return;
    }
    const raw=localStorage.getItem(key);
    if(!raw){
      saveStatus.textContent='LO SLOT '+selectedSlot+' È VUOTO. SALVA PRIMA LA PARTITA.';
      return;
    }
    try{
      const data=JSON.parse(raw);
      data.saveName=name;
      localStorage.setItem(key, JSON.stringify(data));
      saveStatus.textContent='SLOT '+selectedSlot+' RINOMINATO IN «'+name+'».';
      updateSlotButtons();
    }catch(e){
      saveStatus.textContent='ERRORE NELLA RINOMINA DELLO SLOT.';
    }
  }

  function deleteGame(){
    const key='micoAdventureSave'+selectedSlot;
    if(!localStorage.getItem(key)){
      saveStatus.textContent='LO SLOT '+selectedSlot+' È GIÀ VUOTO.';
      return;
    }
    localStorage.removeItem(key);
    saveStatus.textContent='SALVATAGGIO DELLO SLOT '+selectedSlot+' CANCELLATO.';
    updateSlotButtons();
  }

  function loadGame(){
    try{
      const raw=localStorage.getItem('micoAdventureSave'+selectedSlot);
      if(!raw){
        saveStatus.textContent='LO SLOT '+selectedSlot+' È VUOTO.';
        say('Lo slot '+selectedSlot+' è vuoto.');
        return;
      }
      clearTimers();
      const data=JSON.parse(raw);
      saveName.value=data.saveName || ('Salvataggio '+selectedSlot);
      scene=data.scene || 'regia';
      warehouseConversationStarted=!!data.warehouseConversationStarted;
      barrierReached=!!data.barrierReached;
      passChecked=!!data.passChecked;
      cooperativeCleared=!!data.cooperativeCleared;
      accessGranted=!!data.accessGranted;
      selectedItem=data.selectedItem || '';
      goWarehouse.style.display='none';
      goBarrier.style.display='none';
      if(scene === 'barrier'){
        document.getElementById('bg').src=barrierBackground;
        configureBarrierHotspots();
        if(typeof warehouseAudio !== 'undefined'){
          warehouseAudio.pause();
          warehouseAudio.currentTime=0;
          warehouseStarted=false;
        }
        if(typeof loungeAudio !== 'undefined'){
          loungeAudio.pause();
          loungeAudio.currentTime=0;
          loungeStarted=false;
        }
        if(typeof barrierAudio !== 'undefined'){
          barrierAudio.currentTime=0;
          barrierAudio.play().catch(function(){});
          barrierStarted=true;
        }
      }else if(scene === 'warehouse'){
        document.getElementById('bg').src=warehouseBackground;
        configureWarehouseHotspots();
        if(typeof loungeAudio !== 'undefined'){
          loungeAudio.pause();
          loungeAudio.currentTime=0;
          loungeStarted=false;
        }
        if(typeof barrierAudio !== 'undefined'){
          barrierAudio.pause();
          barrierAudio.currentTime=0;
          barrierStarted=false;
        }
        if(typeof warehouseAudio !== 'undefined'){
          warehouseAudio.currentTime=0;
          warehouseAudio.play().catch(function(){});
          warehouseStarted=true;
        }
      }else{
        document.getElementById('bg').src=regiaBackground;
        if(typeof barrierAudio !== 'undefined'){
          barrierAudio.pause();
          barrierAudio.currentTime=0;
          barrierStarted=false;
        }
        if(typeof warehouseAudio !== 'undefined'){
          warehouseAudio.pause();
          warehouseAudio.currentTime=0;
          warehouseStarted=false;
        }
      }
      verb=data.verb || 'GUARDA';
      radioCalled=!!data.radioCalled;
      panicked=!!data.panicked;
      responsibleCalled=!!data.responsibleCalled;
      cableDiagnosed=!!data.cableDiagnosed;
      cableFixed=!!data.cableFixed;
      phoneConversationStarted=!!data.phoneConversationStarted;
      inventory=Array.isArray(data.inventory) ? data.inventory.slice() : [];
      if(scene === 'barrier'){
        if(inventory.indexOf('CELLULARE') === -1) inventory.push('CELLULARE');
        if(inventory.indexOf('PASS') === -1) inventory.push('PASS');
      }
      msg.textContent=data.message || 'Partita caricata.';
      panic.style.display=data.panicVisible || 'none';
      if(scene === 'warehouse' && warehouseConversationStarted){
        goBarrier.style.display='block';
      }
      if(scene === 'barrier' && accessGranted){
        goWarehouse.textContent='🚪 VAI AL MAGAZZINO';
        goWarehouse.style.display='block';
      }
      renderInventory();
      buttons.forEach(function(button){
        button.classList.toggle('sel', button.dataset.verb === verb);
      });
      saveStatus.textContent='SLOT '+selectedSlot+' CARICATO.';
      updateSlotButtons();
    }catch(e){
      saveStatus.textContent='SALVATAGGIO DANNEGGIATO.';
      say('Non riesco a caricare la partita.');
    }
  }

  function updateAudioButton(){
    audioBtn.textContent = audioMuted ? '🔇 AUDIO OFF' : '🔊 AUDIO ON';
    audioBtn.style.borderColor = audioMuted ? '#ff4545' : '';
    audioBtn.style.color = audioMuted ? '#ff4545' : '';
  }

  function setAudioMuted(muted){
    audioMuted = muted;
    if(audioMuted){
      loungeAudio.pause();
      warehouseAudio.pause();
      barrierAudio.pause();
    }else{
      if(scene === 'warehouse') warehouseAudio.play().catch(function(){});
      else if(scene === 'barrier') barrierAudio.play().catch(function(){});
      else loungeAudio.play().catch(function(){});
    }
    updateAudioButton();
    saveStatus.textContent = audioMuted ? 'AUDIO DISATTIVATO.' : 'AUDIO RIATTIVATO.';
  }

  function openMenu(){
    menuOverlay.style.display='flex';
    updateSlotButtons();
    const raw=localStorage.getItem('micoAdventureSave'+selectedSlot);
    if(raw){
      try{
        const data=JSON.parse(raw);
        saveName.value=data.saveName || '';
      }catch(e){
        saveName.value='';
      }
    }else{
      saveName.value='';
    }
    saveStatus.textContent='SLOT '+selectedSlot+' SELEZIONATO.';
  }

  function closeMenu(){
    menuOverlay.style.display='none';
  }

  goWarehouse.addEventListener('click', function(){
    enterWarehouse();
  });

  goBarrier.addEventListener('click', function(){
    enterBarrier();
  });

  menuBtn.addEventListener('click', openMenu);
  audioBtn.addEventListener('click', function(){ setAudioMuted(!audioMuted); });
  slotButtons.forEach(function(button){
    button.addEventListener('click', function(){
      selectedSlot=Number(button.dataset.slot);
      const raw=localStorage.getItem('micoAdventureSave'+selectedSlot);
      if(raw){
        try{
          const data=JSON.parse(raw);
          saveName.value=data.saveName || '';
        }catch(e){
          saveName.value='';
        }
      }else{
        saveName.value='';
      }
      updateSlotButtons();
      saveStatus.textContent='SLOT '+selectedSlot+' SELEZIONATO.';
    });
  });
  saveBtn.addEventListener('click', saveGame);
  loadBtn.addEventListener('click', loadGame);
  deleteBtn.addEventListener('click', deleteGame);
  renameBtn.addEventListener('click', renameGame);
  exitBtn.addEventListener('click', function(){
    menuOverlay.style.display='none';
  });
  resumeBtn.addEventListener('click', function(){
    exitScreen.style.display='none';
  });

  function act(name){
    if(scene === 'barrier'){
      if(verb === 'GUARDA'){
        if(name === 'mixer') return say('🚧 La sbarra è abbassata. Senza pass, Andriu non entra.');
        if(name === 'phone') return say('👮 La guardia è davanti alla sbarra, con il dispositivo per leggere i PASS.');
        if(name === 'monitor') return say('🏢 Ingresso MiCo. Dentro si lavora, ma per ora Andriu è fuori.');
        if(name === 'radio') return say('📹 Una telecamera controlla ogni ingresso. Perfetto.');
        if(name === 'door') return say('🚪 L’uscita pedonale. Meglio non allontanarsi dal MiCo.');
        return say('Un dettaglio dell’ingresso del MiCo.');
      }
      if(verb === 'PARLA' && name === 'phone') return say('👮 GUARDIA: «Ciao carissimo! Se fai sesso come parcheggi l\'accechi, dammi il PASS che te lo sparo.»');
      if(verb === 'USA' && name === 'phone'){
        if(selectedItem === 'PASS') return presentPassToGuard();
        return say('📋 La guardia allunga la mano verso il dispositivo. «Prima fammi vedere il PASS.»');
      }
      if(verb === 'APRI' && name === 'mixer') return say('🚧 La sbarra non si apre. Serve un’autorizzazione.');
      return say('Non c’è niente da fare con questo oggetto, per ora.');
    }

    if(scene === 'warehouse'){
      if(verb === 'GUARDA'){
        if(name === 'phone') return say('È l’ON SITE MANAGER. Sta facendo il briefing con la squadra tecnica.');
        if(name === 'mixer') return say('Pile di bauli Mico A/V. Tutto il necessario per allestire un evento.');
        if(name === 'monitor') return say('La squadra tecnica è riunita. Nastri, pinze, radio e attrezzatura sono pronti.');
        if(name === 'door') return say('L’uscita del magazzino. Da qui Andriu deve uscire per contattare la cooperativa.');
        if(name === 'cable') return say('Cavi A/V arrotolati e pronti per il prossimo allestimento.');
        return say('Un angolo del magazzino pieno di attrezzatura A/V.');
      }
      if(verb === 'PARLA' && name === 'phone') return talkOnSiteManager();
      if(verb === 'USA' && name === 'phone') return talkOnSiteManager();
      if(verb === 'APRI' && name === 'door') return say('Apro l’uscita del magazzino. Prima devo parlare con la cooperativa.');
      if(verb === 'CHIUDI' && name === 'door') return say('Meglio non chiudere l’uscita. Devo tornare fuori.');
      return say('Non c’è niente da fare con questo oggetto, per ora.');
    }

    if(verb === 'GUARDA'){
      if(name === 'mixer') return say('Yamaha RIVAGE. La regia è pronta per la plenaria.');
      if(name === 'fader') return say('Il primo fader a sinistra del RIVAGE. È quello che devo manovrare.');
      if(name === 'postit') return say('Il post-it dice: NO FEEDBACK! Un consiglio che arriva sempre troppo tardi.');
      if(name === 'radio') return say('La radio di servizio. Da qui arrivano le chiamate dal palco.');
      if(name === 'phone') return say('Il telefono della regia. Quando qualcosa va storto, qualcuno finisce sempre per chiamare il responsabile.');
      if(name === 'monitor') return say('RELATORE PRONTO • PLENARIA • STREAMING OK. Per ora...');
      if(name === 'door') return say('Backstage. Cavi, relatori, runner e almeno tre persone che cercano qualcuno.');
      if(name === 'cable') return say('Un groviglio di cavi sotto la console. Uno di questi va verso il sistema luci.');
      if(name === 'coffee') return say(coffeeDrunk ? 'La tazza è vuota. Il fonico ha già fatto il pieno di caffeina.' : 'Caffè. L’unica cosa veramente indispensabile in regia.');
    }

    if(verb === 'PRENDI'){
      if(name === 'coffee'){
        if(inventory.indexOf('CAFFÈ') === -1){
          inventory.push('CAFFÈ');
          renderInventory();
          say('Prendi il caffè. La vera alimentazione del fonico.');
        }else{
          say('Il caffè è già nel tuo inventario.');
        }
      }else{
        say('Non posso prendere quello.');
      }
      return;
    }

    if(verb === 'USA'){
      if(name === 'radio') return panicked ? callResponsible() : radioCall();
      if(name === 'mixer') return useMixer();
      if(name === 'fader') return useFader();
      if(name === 'phone') return callResponsible();
      if(name === 'cable') return fixCable();
      if(name === 'coffee') return drinkCoffee();
      return say('Non posso usarlo così.');
    }

    if(verb === 'PARLA'){
      if(name === 'radio') return panicked ? callResponsible() : radioCall();
      if(name === 'phone') return callResponsible();
      if(name === 'cable') return cableDiagnosed ? say('«È quello! Il cavo era finito nel DMX delle luci.»') : say('«Che succede con questi cavi?» — Il tecnico di palco sta ancora cercando di capire.');
      if(name === 'door') return say('«Che succede sul palco?» — Nessuna risposta. Il backstage è nel caos.');
      return say('Non c’è nessuno con cui parlare qui.');
    }

    if(verb === 'APRI'){
      if(name === 'door') return say('Apro la porta verso il backstage.');
      return say('Non si apre.');
    }

    if(verb === 'CHIUDI'){
      if(name === 'door') return say('Chiudo la porta della regia. Meglio concentrarsi.');
      return say('Non posso chiuderlo.');
    }

    if(verb === 'SPINGI'){
      if(name === 'fader') return useFader();
      if(name === 'cable') return fixCable();
      return say('Non è qualcosa da spingere.');
    }

    if(verb === 'DAI'){
      if(name === 'radio' && inventory.indexOf('CAFFÈ') !== -1) return say('«Un caffè?» — No. Dalla radio non arriva nessuna risposta.');
      return say('A chi dovrei darlo?');
    }
  }

  buttons.forEach(function(button){
    button.classList.toggle('sel', button.dataset.verb === verb);
    button.addEventListener('click', function(){
      setVerb(button.dataset.verb);
    });
  });

  hotspots.forEach(function(hotspot){
    hotspot.addEventListener('click', function(){
      act(hotspot.dataset.name);
    });
  });

  renderInventory();
  updateAudioButton();

  // Rumore ambientale del Magazzino Mico A/V.
  const warehouseAudio = new Audio('https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/assets/magazzino_urban_ferraglia_loop.wav');
  warehouseAudio.loop = true;
  warehouseAudio.volume = 0.42;
  warehouseAudio.preload = 'auto';
  warehouseAudio.playsInline = true;
  let warehouseStarted = false;

  // Rumore stradale della Sbarra: auto, motorini e traffico urbano.
  const barrierAudio = new Audio('https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/assets/sbarra-traffico-urbano-loop.mp3');
  barrierAudio.loop = true;
  barrierAudio.volume = 0.42;
  barrierAudio.preload = 'auto';
  barrierAudio.playsInline = true;
  let barrierStarted = false;

  // Musica lounge ambientale della Regia Gold.
  const loungeAudio = new Audio('https://raw.githubusercontent.com/Pilaf1986/mico-adventure/main/regia-gold-lounge-v2.mp3');
  loungeAudio.loop = true;
  loungeAudio.volume = 0.55;
  loungeAudio.preload = 'auto';
  loungeAudio.playsInline = true;

  let loungeStarted = false;

  async function startLounge(){
    if(audioMuted) return;
    if(loungeStarted) return;
    try{
      loungeAudio.pause();
      loungeAudio.currentTime = 0;
      await loungeAudio.play();
      loungeStarted = true;
    }catch(e){}
  }

  // Una sola partenza al primo gesto dell'utente.
  document.addEventListener('click', startLounge, {once:true});
  document.addEventListener('touchstart', startLounge, {once:true, passive:true});


  later(radioCall, 2500);
})();
</script>
</body>
</html>
